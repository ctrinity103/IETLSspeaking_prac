<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Speaking Part 2 Practice Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="sun" aria-hidden="true"></div>
    <h1>Greenhouse Speaking</h1>
    <p class="subtitle">IELTS Part 2 &middot; grow a new answer</p>

    <div class="controls">
      <label for="topic-select">Plot</label>
      <select id="topic-select"></select>
    </div>

    <div class="card">
      <span class="category" id="category"></span>
      <h2 class="topic-title" id="topic-title"></h2>
      <ul class="cue-card" id="cue-card"></ul>

      <section>
        <h2>Vocabulary to use</h2>
        <ul class="vocab-list" id="vocab-list"></ul>
      </section>

      <section>
        <h2>Grammar challenge</h2>
        <div class="grammar-box">
          <h3 id="grammar-name"></h3>
          <p id="grammar-explanation"></p>
          <p class="grammar-example" id="grammar-example"></p>
        </div>
      </section>

      <button id="generate-btn">Grow a New Topic</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
